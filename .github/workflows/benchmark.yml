name: Benchmark

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Run benchmark
        run: |
          pip install nox
          nox
      - name: Upload benchmark json
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-json-${{ strategy.job-index }}
          path: .benchmarks/**

  publish:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download benchmark HTML
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-json-*
          path: .benchmarks
          merge-multiple: true
      - name: Generate HTML
        run:  python3 generate_html.py
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .benchmarks/html
